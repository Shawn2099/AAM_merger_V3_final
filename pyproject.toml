[project]
name = "aam-merger-final"
version = "0.1.0"
description = "AAM Merger V3 — PO/DN/SI reconciliation → merged PDF (FastAPI + Prefect + SQLite WAL). Cross-platform: Linux dev → WS2016 prod via config.yaml."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — internal CA tool" }
dependencies = [
    # SPEC §5.2 approved — pins checked 2026-08-15, WS2016 (py 3.11) compatible, latest patches
    "fastapi>=0.124.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "instructor>=1.11.0",
    "openai>=1.107.0",
    "prefect>=3.4.0",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.0",
    "rapidfuzz>=3.14.0",
    "pypdf>=5.9.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "tenacity>=9.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
    "ty>=0.0.1a20",
    "pip-audit>=2.9.0",
]
# keep sync with [tool.*] below

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["D", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "UP035", "UP007", "I001"]
"alembic/env.py" = ["E501", "I001", "F401"]
"tests/*.py" = ["E501"]
"src/app/api/routes/po_sets.py" = ["E501"]
"src/app/core/config.py" = ["E501"]
"src/app/models/models.py" = ["E501"]
"src/app/services/customs.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers --cov=src --cov-fail-under=0 --cov-report=term-missing"
markers = [
    "slow: marks tests as slow",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
source = ["src"]
branch = true

