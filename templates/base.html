<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AAM Merger V3 — Smart Document Reconciler{% endblock %}</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Theme -->
  <link rel="stylesheet" href="/static/css/theme.css">
  
  <!-- HTMX & Alpine.js -->
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script src="/static/js/app.js"></script>
  
  {% block head %}{% endblock %}
</head>
<body x-data>

  <!-- Sticky Application Navbar -->
  <nav class="app-navbar">
    <a href="/dashboard" class="nav-brand">
      <div class="brand-icon">⚡</div>
      <span>AAM Merger <small style="font-size:0.75rem; font-weight:400; opacity:0.8;">v3</small></span>
    </a>
    
    <div class="nav-links">
      <a href="/dashboard" class="nav-link {% if request.url.path.startswith('/dashboard') or request.url.path == '/' or request.url.path.startswith('/po_sets') %}active{% endif %}">
        <span>📊 Dashboard</span>
      </a>
      
      <a href="/unclassified" class="nav-link {% if request.url.path.startswith('/unclassified') %}active{% endif %}">
        <span>❓ Unclassified</span>
        {% if unclassified_count and unclassified_count > 0 %}
          <span class="nav-counter-badge">{{ unclassified_count }}</span>
        {% endif %}
      </a>
      
      <a href="/quarantine" class="nav-link {% if request.url.path.startswith('/quarantine') %}active{% endif %}">
        <span>🚨 Quarantine</span>
      </a>
      
      <a href="/audit" class="nav-link {% if request.url.path.startswith('/audit') %}active{% endif %}">
        <span>📜 Audit Log</span>
      </a>
      
      <a href="/manual/merger" class="nav-link {% if request.url.path.startswith('/manual') %}active{% endif %}">
        <span>🛠️ Manual Merger</span>
      </a>
    </div>

    <div class="nav-right">
      <a href="/health" class="nav-link" title="System Health Status" style="font-size:0.82rem;">
        <span class="health-dot"></span>
        <span style="color:#94a3b8;">Service Online</span>
      </a>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Slide-Over PDF Preview Drawer -->
  <div 
    class="drawer-backdrop" 
    :class="{ 'open': $store.pdfDrawer.isOpen }" 
    @click.self="$store.pdfDrawer.close()"
    x-cloak
  >
    <div class="drawer-panel">
      <div class="drawer-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:1.2rem;">📄</span>
          <strong x-text="$store.pdfDrawer.title" style="color:var(--text-main); font-size:1rem;"></strong>
        </div>
        <button 
          class="btn btn-secondary btn-sm" 
          @click="$store.pdfDrawer.close()" 
          title="Close (Esc)"
        >
          ✕ Close
        </button>
      </div>
      <div class="drawer-body">
        <template x-if="$store.pdfDrawer.isOpen">
          <iframe 
            :src="$store.pdfDrawer.url" 
            class="drawer-iframe" 
            title="Document Viewer"
          ></iframe>
        </template>
      </div>
    </div>
  </div>

  <!-- Global Floating Toast Stack -->
  <div class="toast-container" x-cloak>
    <template x-for="t in $store.toasts.items" :key="t.id">
      <div :class="'toast toast-' + t.type">
        <span x-show="t.type === 'success'">✅</span>
        <span x-show="t.type === 'error'">❌</span>
        <span x-show="t.type === 'warning'">⚠️</span>
        <span x-show="t.type === 'info'">ℹ️</span>
        <span x-text="t.message" style="flex:1;"></span>
        <button class="toast-dismiss" @click="$store.toasts.remove(t.id)">×</button>
      </div>
    </template>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
